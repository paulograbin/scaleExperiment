quarkus.http.port=8080
quarkus.http.idle-timeout=120s
quarkus.http.so-reuse-port=true
quarkus.http.tcp-quick-ack=true
quarkus.http.tcp-fast-open=true

# Vert.x event loop threads = cores
quarkus.vertx.event-loops-pool-size=4

# Metrics at /q/metrics (Prometheus format)
quarkus.micrometer.export.prometheus.enabled=true

# Health at /q/health
quarkus.smallrye-health.ui.enable=false

# Minimize logging under load
quarkus.log.level=WARN
quarkus.log.category."com.paulograbin".level=INFO

# Disable banner
quarkus.banner.enabled=false
