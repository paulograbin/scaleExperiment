spring:
  application:
    name: scale-experiment
  threads:
    virtual:
      enabled: false
  main:
    banner-mode: off
    lazy-initialization: true
  jmx:
    enabled: false

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: false
  undertow:
    threads:
      io: 24
      worker: 200
    buffer-size: 1024
    direct-buffers: true
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    enable:
      http: false
      jvm: false
      system: false
      process: false
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.paulograbin.scale: INFO
